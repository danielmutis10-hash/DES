<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <title>Datos alumno</title>
</head>
<body>
    <div class="formulario">
        <h2>Datos alumno</h2>

        <form action="datos.php" method="POST">
            <!--Nombre del estudiante con acción requerida ya que es obligatoria-->
            <div class="form-group">
                <label>
                    Nombre:
                    <span class="obligatorio">*Obligatorio</span>
                </label>
                <input type="text" name="nombre" required>
            </div>

            <!--Apellido 1 del estudiante-->
            <div class="form-group">
                <label>Apellido1:</label>
                <input type="text" name="ape1">
            </div>

            <!--Apellido 2 del estudiante-->
            <div class="form-group">
                <label>Apellido2:</label>
                <input type="text" name="ape2">
            </div>

            <!--Email del estudiante y con acción obligatoria-->
            <div class="form-group">
                <label>
                    Email:
                    <span class="obligatorio">*Obligatorio</span>
                    <input type="email" name="email" required>
                </label>
            </div>

            <!--genero del estudiante y con acción obligatoria-->
            <div class="form-group">
                <label>
                    Sexo:
                    <span class="obligatorio">*Obligatorio</span>
                </label>
                <div class="radio-group">
                    <label><input type="radio" name="sexo" value="Mujer" required>Mujer</label>
                    <label><input type="radio" name="sexo" value="Hombre" required>Hombre</label>
                </div>
            </div>

            <!--Botones de enviar y borrar-->
            <div class="buttons">
                <button type="submit">Enviar</button>
                <button type="reset">Borrar</button>
            </div>

        </form>
    </div>
</body>
</html>
